#shade{position:fixed;inset:0;background:linear-gradient(#000 0,rgba(0,0,0,.55) 28%,rgba(0,0,0,.15) 60%,rgba(0,0,0,.6) 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
header{text-align:center;margin-bottom:1.5rem}
header small{letter-spacing:.4em;font-size:.7rem;color:#bbb;text-transform:uppercase}
header h1{margin:.4rem 0 0;font-weight:300;font-size:clamp(1.6rem,5vw,3rem);letter-spacing:.12em}
.stage{position:relative;width:100%;max-width:80rem;height:28rem;display:flex;justify-content:center;align-items:center;perspective:1400px}
.card{position:absolute;width:14rem;height:21rem;cursor:pointer;will-change:transform}
.face{position:absolute;inset:0;border-radius:1.3rem;border:1px solid rgba(255,255,255,.3);background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.22),rgba(255,255,255,.04) 45%,rgba(0,0,0,.8));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.35);padding:1.3rem;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.face:before{content:"";position:absolute;inset:.45rem;border:1px solid rgba(255,255,255,.1);border-radius:1rem;pointer-events:none}
.face:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-15deg);transition:left .8s}
.card:hover .face:after{left:130%}
.top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.num{font-size:.7rem;letter-spacing:.3em;color:#aaa}
.ico{width:2.6rem;height:2.6rem;stroke:#fff;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.big{display:none;font-size:5rem;font-weight:100;line-height:1;color:rgba(255,255,255,.12);position:absolute;right:.8rem;bottom:3.6rem;letter-spacing:-.05em}
.front h2{margin:0;font-size:1.5rem;font-weight:300;line-height:1.15;letter-spacing:.03em;position:relative;z-index:2}
.hint{font-size:.64rem;letter-spacing:.25em;text-transform:uppercase;color:#aaa;margin-top:.7rem;display:flex;align-items:center;gap:.5rem}
.hint:before{content:"";width:1.4rem;height:1px;background:#aaa}
#page{position:fixed;inset:0;z-index:100;display:none;overflow-y:auto;background:rgba(0,0,0,.84)}
.wrap{max-width:62rem;margin:0 auto;padding:5.5rem 1.5rem 6rem}
.kick{letter-spacing:.4em;font-size:.72rem;color:#aaa;text-transform:uppercase}
.wrap h1{font-weight:200;font-size:clamp(2.4rem,8vw,5.5rem);margin:.6rem 0 2rem;letter-spacing:.02em;line-height:1.05}
.wrap h1 span{display:block;font-size:.45em;color:#aaa;letter-spacing:.2em;margin-top:.6rem}
.lead{font-size:clamp(1rem,2.4vw,1.35rem);font-weight:300;line-height:1.6;color:#ddd;max-width:40rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin-top:2rem}
.box{border:1px solid rgba(255,255,255,.22);border-radius:1rem;padding:1.3rem;background:rgba(255,255,255,.05)}
.box .k{font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;color:#999}
.box .v{font-size:2.6rem;font-weight:200;margin:.4rem 0}
.box .s{font-size:.95rem;color:#ddd;line-height:1.5}
.box h3{margin:.3rem 0 .4rem;font-weight:400;font-size:1.15rem}
.tags{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.tags span{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.5rem 1.1rem;font-size:.9rem;background:rgba(255,255,255,.06)}
.tl{position:relative;margin-top:2rem;padding-left:2rem;border-left:1px solid rgba(255,255,255,.3)}
.tl .it{position:relative;margin-bottom:1.4rem;border:1px solid rgba(255,255,255,.2);border-radius:1rem;padding:1.2rem 1.4rem;background:rgba(255,255,255,.05)}
.tl .it:before{content:"";position:absolute;left:-2.4rem;top:1.6rem;width:.8rem;height:.8rem;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
.it .yr{font-size:.65rem;letter-spacing:.28em;color:#999;text-transform:uppercase}.it h3{margin:.3rem 0;font-weight:400;font-size:1.25rem}.it .m{float:right;font-size:1.8rem;font-weight:200}.it p{margin:.3rem 0 0;color:#ccc;font-size:.95rem;line-height:1.5}
.term{margin-top:2rem;border:1px solid rgba(255,255,255,.25);border-radius:.9rem;background:rgba(0,0,0,.6);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;line-height:1.8;overflow:hidden}
.term .bar{padding:.5rem .9rem;border-bottom:1px solid rgba(255,255,255,.15);color:#888;font-size:.7rem;letter-spacing:.2em}
.term div:not(.bar){padding:0 1.1rem}.term div:last-child{padding-bottom:.9rem}.term .c{color:#8a8a8a}
.h2{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:#aaa;margin:2.4rem 0 .2rem}
.box .tags{margin-top:.8rem}.box .tags span{padding:.3rem .8rem;font-size:.78rem}
.box .n{font-size:1.4rem;margin-bottom:.3rem;font-weight:200;color:#888}
.art-c{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;min-height:0;padding:.4rem 0}.art-c svg{width:86%;max-height:100%}
.spin{transform-origin:100px 100px;transform-box:view-box;animation:spin 28s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:flt 5s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-7px)}}
.tw{animation:tw 3s ease-in-out infinite}.tw:nth-of-type(odd){animation-delay:1.2s}@keyframes tw{50%{opacity:.25}}
.card:focus-visible,.pbtn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.hero{display:grid;grid-template-columns:1.35fr .8fr;gap:2rem;align-items:center}
.art{justify-self:center;width:100%;max-width:20rem}.art svg{width:100%;height:auto;filter:drop-shadow(0 0 28px rgba(255,255,255,.3))}
.wrap h1{background:linear-gradient(180deg,#fff 30%,#8c8c8c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-wrap:balance;letter-spacing:-.02em}
.wrap h1 span{-webkit-text-fill-color:#aaa;font-weight:300;letter-spacing:.2em}
.wrap{max-width:66rem}.lead{text-wrap:pretty}
.h2{display:flex;align-items:center;gap:1rem}.h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.35),transparent)}
.box{position:relative;overflow:hidden;transition:border-color .4s,background-color .4s}
.box:before{content:"";position:absolute;inset:0;background:radial-gradient(16rem circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 65%);opacity:0;transition:opacity .4s;pointer-events:none}
.box:hover{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.08)}.box:hover:before{opacity:1}
.box .v,.it .m{font-variant-numeric:tabular-nums}
.tags span{transition:background-color .3s,color .3s}.tags span:hover{background:#fff;color:#000}
.it{transition:border-color .4s}.it:hover{border-color:rgba(255,255,255,.55)}
#page{background:rgba(0,0,0,.7);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.art{order:-1;max-width:11rem}}
